name: Validate preserved research section
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Rebuild and check preserved research
        run: |
          cd research
          python3 scripts/build.py
          python3 scripts/validate.py
          git diff --exit-code -- .
