name: Validate complete healthcare guide
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthcare-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all owned generators in order
        run: python3 scripts/build_all.py
      - name: Check core, evidence, regressions and local links
        run: |
          python3 scripts/check_core.py
          python3 scripts/check_accuracy.py
          python3 scripts/check_links.py
          python3 scripts/check_integration.py
          python3 scripts/check_e071bffc.py
      - name: Validate preserved research sections
        run: |
          python3 coverage-guide/scripts/check.py
          (cd research && python3 scripts/validate.py)
      - name: Ensure generated files are committed and reproducible
        run: |
          git diff --exit-code
          python3 scripts/build_all.py
          git diff --exit-code
      - name: Stage only public site resources
        run: |
          python3 scripts/stage_site.py
          python3 scripts/check_integration.py --site dist
      # Publication uses the repository's existing legacy Pages build from main.
      # It publishes committed source/generated pages, NOT the ignored dist folder.
      # Staging is validated for local preview/export only. No separate deploy job.
