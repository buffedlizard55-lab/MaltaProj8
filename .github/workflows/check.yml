name: Validate evidence and site
on:
  push:
    branches: [main, arena/05508cd2-maltaproj8]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/check.py
      - name: Confirm editorial register matches JSON
        run: |
          python scripts/seed_research.py
          git diff --exit-code -- research/findings.json
