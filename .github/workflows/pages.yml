name: Build and deploy complete healthcare guide
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: healthcare-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build all owned generators in order
        run: python3 scripts/build_all.py
      - name: Check core, evidence, regressions and local links
        run: |
          python3 scripts/check_core.py
          python3 scripts/check_accuracy.py
          python3 scripts/check_links.py
          python3 scripts/check_integration.py
          python3 scripts/check_e071bffc.py
      - name: Validate preserved research sections
        run: |
          python3 coverage-guide/scripts/check.py
          (cd research && python3 scripts/validate.py)
      - name: Ensure generated files are committed and reproducible
        run: |
          git diff --exit-code
          python3 scripts/build_all.py
          git diff --exit-code
      - name: Stage only public site resources
        run: |
          python3 scripts/stage_site.py
          python3 scripts/check_integration.py --site dist
      - name: Upload complete Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: validate-site
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Wait for any legacy Pages build before publishing verified artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mode=$(gh api repos/${{ github.repository }}/pages --jq .build_type)
          if [ "$mode" = legacy ]; then
            for attempt in $(seq 1 60); do
              result=$(gh api repos/${{ github.repository }}/pages/builds/latest --jq '[.commit,.status] | @tsv')
              echo "Legacy build: $result"
              sha=$(printf '%s' "$result" | cut -f1)
              status=$(printf '%s' "$result" | cut -f2)
              if [ "$sha" = "$GITHUB_SHA" ] && { [ "$status" = built ] || [ "$status" = errored ]; }; then
                exit 0
              fi
              sleep 3
            done
            echo 'Legacy build did not settle for this commit; refusing a competing deployment.'
            exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy verified complete site
        id: deployment
        uses: actions/deploy-pages@v4
