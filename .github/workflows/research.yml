name: Verify Pages site
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cd research && python scripts/build.py && python scripts/validate.py
      - name: Stage website only
        run: |
          mkdir -p _site
          cp research/*.html _site/
          cp -r research/assets research/data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
